<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>promise</title>
  </head>
  <body>
    <script>
      // synchronus
      // Promise :- 🟡 Pending → Order ban raha hai., 🟢 Fulfilled → Order mil gaya. ,🔴 Rejected → Order cancel ho gaya.

      // Q1 Promise banao. and Resolve karo

      let promise = new Promise((resolve, reject) => {
        let success = true;
        if (success) {
          resolve(" Hello promise");
        } else {
          reject("no promise");
        }
      });

      promise
        .then((data) => {
          console.log(data);
        })
        .catch((err) => {
          console.log(err);
        });

      // Q2 Promise banao and Reject karo

      let promise1 = new Promise((resolve, reject) => {
        let a = false;
        if (a) {
          resolve("something");
        } else {
          reject("something went wrong");
        }
      });

      promise1
        .then((data) => {
          console.log(data);
        })
        .catch((err) => {
          console.log(err);
        });

      //Q3 id pass

      let promise2 = new Promise((resolve, reject) => {
        let isPassed = true;
        if (isPassed) {
          resolve("Pass");
        } else {
          reject("fail");
        }
      });

      promise2
        .then((data) => {
          console.log(data);
        })
        .catch((err) => {
          console.log(err);
        });

      // Q4 age eligible or not

      let promise3 = new Promise((resolve, reject) => {
        let age = 20;
        if (age >= 18) {
          resolve("Eligible");
        } else {
          reject("Not Eligible");
        }
      });

      promise3
        .then((data) => {
          console.log(data);
        })
        .catch((err) => {
          console.log(err);
        });

      // Q5 Login

      let promise4 = new Promise((resolve, reject) => {
        let username = "Aakash";
        let password = "1234";
        if (username === "Aakash" && password === "1234") {
          resolve("Login success");
        } else {
          reject("Invalid Credentials");
        }
      });

      promise4
        .then((data) => {
          console.log(data);
        })
        .catch((err) => {
          console.log(err);
        });

      // Finally()

      let promise5 = new Promise((resolve, reject) => {
        resolve("Success");
      });

      promise5
        .then((data) => {
          console.log(data);
        })
        .catch((err) => {
          console.log(err);
        })
        .finally(() => {
          console.log("Promise Completed");
        });

      // Q1 Payment

      let promise6 = new Promise((resolve, reject) => {
        let payment = true;
        if (payment) {
          resolve("payment successfull");
        } else {
          reject("payment failed");
        }
      });
      promise6
        .then((data) => {
          console.log(data);
        })
        .catch((err) => {
          console.log(err);
        })
        .finally(() => {
          console.log("Thank You");
        });

      // Asynchronus :- Timeout

      let promise7 = new Promise((resolve, reject) => {
        setTimeout(() => {
          resolve("Data Loaded");
        }, 2000);
      });

      promise7.then((data) => {
        console.log(data);
      });

      // Q1 name print using resolve

      let promise8 = new Promise((resolve, reject) => {
        setTimeout(() => {
          resolve("Welcome Aakash");
        }, 3000);
      });

      promise8.then((data) => {
        console.log(data);
      });

      // Q2 print using Reject

      let promise9 = new Promise((resolve, reject) => {
        setTimeout(() => {
          reject("Server Error");
        }, 3000);
      });

      promise9
        .then((data) => {
          console.log(data);
        })
        .catch((err) => {
          console.log(err);
        });

      // Async= Is function me Promise use hoga. and Await = Promise complete hone ka wait karo, phir aage badho.

      let promise11 = new Promise((resolve) => {
        resolve("Hello Async");
      });

      async function greet() {
        let data = await promise11;
        console.log(data);
      }
      greet();

      //Q2

      let promise12 = new Promise((resolve) => {
        setTimeout(() => {
          resolve("Data Loaded");
        }, 2000);
      });

      async function show() {
        let data = await promise12;

        console.log(data);
      }

      show();

      // Try and Catch

      let promise14 = new Promise((resolve, reject) => {
        reject("Network Error");
      });

      async function how() {
        try {
          let data = await promise14;

          console.log(data);
        } catch (err) {
          console.log(err);
        }
      }

      how();

      // Q1

      let promise15 = new Promise((resolve, reject) => {
        setTimeout(() => {
          reject("Server Error");
        }, 2000);
      });

      async function hello() {
        try{
          let a = await promise15;
          console.log(a);
        } catch(err){
          console.log(err);
        }
      }
      hello();


    </script>
  </body>
</html>
