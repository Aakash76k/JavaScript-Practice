<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise-Advance</title>
</head>
<body>

    <script>
        // Promise chaining:- Ek Promise complete hone ke baad uski value lekar doosra Promise/.then() chalana hi Promise Chaining hai.


       // Q1
        let promise = new Promise((resolve,reject)=>{
            resolve(5);
        })
        promise
        .then((num)=>{
            return num + 5;
        })
        .then((num)=>{
            return num * 2;
        })
        .then((num)=>{
            console.log(num);
        })

        //Q2

        let promise2 = new Promise((resolve,reject)=>{
            resolve("Hello ");
        })
        promise2
        .then((data)=>{
            return data + "Aakash";
        })
        .then((data)=>{
            return data + "🚀";
        })
        .then((data)=>{
            console.log(data);
        })

        //Q3

         let promise3 = new Promise((resolve,reject)=>{
            resolve(100);
        })
        promise3
        .then((num)=>{
            return num - 20;
        })
        .then((num)=>{
            return num / 2;
        })
        .then((num)=>{
            console.log(num);
        })

        // Promise all():- all request in one time and do return array

        // Q1 

        let p1 = Promise.resolve("HTML");
        let p2 = Promise.resolve("CSS");
        let p3 = Promise.resolve("JavaScript");

        Promise.all([p1,p2,p3])
        .then((data)=>{
            console.log(data);
        });

    </script>
    
</body>
</html>
