<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Execution-Context</title>
  </head>
  <body>
    <script>
      // 1. Execution context :- Execution Context ek environment hai jahan JavaScript code ko prepare aur execute karti hai.
      //    Global Execution Context
      // a. Memory Creation Phase = JavaScript pehle variables/functions ko identify karke execution ke liye environment prepare karti hai.
      // b. Code Execution Phase = memory phase k baad
      //  Function Execution context

      // a. Call stack - Actually Function Execution Context jab function call hota hai, woh Call Stack me push hota hai.

      // Q1 Code Execution Phase
      let a = 10;
      let b = 20;

      let sum = a + b;

      console.log(sum);

      // Q2 Memory Creation Phase
      var c = 10;
      console.log(c); // undefined

      //Global code ke liye → Global Execution Context
      // Function call ke liye → Function Execution Context

      // Q3 global exexution

      var m = 10;

      function greet() {
        var message = "Hello";
        console.log(message);
      }

      greet();

      // Q4 find exection = 2

      var n = 10; // execurion 1 - global

      function test() {
        var x = 20; // execution 2 - function
      }

      test();

      // Call Stack :- Last In, First Out and Call Stack sirf functions ki list nahi hai.Ye Execution Contexts ko manage karta hai.

      function first() {
        console.log("first");
      }
      function second() {
        first();
      }
      second();

      //Q2 nested function execution

      function one() {
        console.log("one");
      }
      function two() {
        one();
        console.log("two");
      }
      function three() {
        two();
        console.log("three");
      }
      three();

      // Q3

      var z = 10;

      function test() {
        var w = 20;
        console.log(z);
        console.log(w);
      }

      test();

      // Q4 Outer scope se variable access

      var r = 10;

      function tes() {
        var t = 20;

        function inner() {
          var y = 30;
          console.log(r);
          console.log(t);
          console.log(y);
        }

        inner();
      }

      tes();

      // Scope Chain :- JavaScript jab kisi variable ko current scope me nahi paati, to outer scope me search karti hai. Phir usse bhi bahar... jab tak Global Scope tak nahi pahunchti.and Scope Chain sirf bahar ki taraf jaati hai.

      //Q1

      var p = "Global";

      function outer() {
        var l = "Outer";

        function inner() {
          var v = "Inner";

          console.log(v);
          console.log(l);
          console.log(p);
        }

        inner();
      }

      outer();

      // Q2 Variable lookup

      var q = 10;

      function outer() {
        var e = 20;

        function inner() {
          var r = 30;

          console.log(e);
        }

        inner();
      }

      outer();

      // Q4 Variable lookup

      //   var a1 = 10;

      //   function outer1() {
      //     var b1 = 20;

      //     function inner1() {
      //       var c1 = 30;
      //     }

      //     console.log(c1); // Reference Error
      //   }

      //   outer1();

      // Lexical Environment:- Lexical Environment ek aisa environment hai jisme JavaScript ko pata hota hai ki variables/functions kahan available hain aur unke outer scope se connection kya hai.

      // Q1

      var a2 = 10;

      function outer2() {
        var b2 = 20;

        function inner2() {
          var c2 = 30;

          console.log(a2);
          console.log(b2);
          console.log(c2);
        }

        inner2();
      }

      outer2();

      // Q2

      function outer() {
        let name = "Aakash";

        function inner() {
          console.log(name);
        }

        return inner;
      }

      let result = outer();

      result();
    </script>
  </body>
</html>
