<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>This</title>
  </head>
  <body>
    <script>
      // object method using this

      //Q1 :- Normal object method ko object.method() ke through call karne par this us object ko refer karta hai.

      let user = {
        name: "Rahul",
        showname: function () {
          console.log(this.name);
        },
      };
      user.showname();

      // Q2 this ka value mostly is baat se decide hota hai ki function ko CALL kaise kiya gaya hai, function banaya kahan gaya tha isse nahi.

      let user1 = {
        name: "Pawan",
        showName: function () {
          console.log(this.name);
        },
      };

      user1.showName(); // Pawan

      let test = user1.showName;
      test(); // undefiend

      // Q3 Normal :- Normal function → this call-site se decide hota hai.
      //  Normal function + non-strict → window
      // Normal function + strict mode → undefined

      function show() {
        console.log(this);
      }
      show(); //window

      // Q4 use strict
      // Normal function + strict mode → undefined

      ("use strict");
      function who() {
        console.log(this); // this-> undefined
      }
      who();

      //Q5 Arrow function :- Arrow function ka apna this nahi hota.
      // Ye apne outer lexical environment ka this leta hai.
      // Arrow function → this lexical/outer scope se aata hai.

      let u = {
        n: "Shivam",
        sh: () => {
          console.log(this.n);
        },
      };

      u.sh(); // undefined

      // Q6 Nested function

      let us = {
        na: "chaman",
        sho: function () {
          function inner() {
            console.log(this.na);
          }
          inner();
        },
      };
      us.sho();

      //Q7 nested using arrow function

      let use = {
        name: "Aakash",

        show: function () {
          const inner = () => {
            console.log(this.name);
          };

          inner();
        },
      };

      use.show();

      // Q8 Constructor
      // new => Naya object banata hai
      function User(name, age) {
        this.name = name;
        this.age = age;
      }

      let User1 = new User("pawan", 23);
      console.log(User1.name);
      console.log(User1.age);

      // Q9 Call()
      // call() aur apply() function ko turant execute kar dete hain.
      //Arguments => Individual

      function show() {
        console.log(this.name);
      }

      let person1 = {
        name: "Aakash",
      };

      let person2 = {
        name: "Rohit",
      };

      show.call(person2);

      // Q10 Apply();
      //Arguments=>Array
      function add(a, b) {
        console.log(this.name, a + b);
      }

      let user3 = {
        name: "Aakash",
      };

      add.call(user3, 10, 20);

      // Q11 bind(); => Ek naya function return karta hai jisme this fix ho jata hai.
      //Arguments=>Individual / preset

      function show() {
        console.log(this.name);
      }

      let user4 = {
        name: "Aakash",
      };

      let newFunction = show.bind(user4);

      newFunction();

      //Q12 Bind

      function show() {
        console.log(this.name);
      }

      let user5 = {
        name: "Aakash",
      };

      let test1 = show.bind(user5);

      console.log("Start");

      test1();

      console.log("End");

      // Q13 this inside Es6 class

      //   class User7 {
      //     constructor(name) {
      //       this.name = name;
      //     }

      //     showName() {
      //       console.log(this.name);
      //     }
      //   }

      //   let user6 = new User7("Aakash");

      //   user6.showName(); // Aakash

      // Q14

      class Use {
        constructor(name) {
          this.name = name;
        }

        show() {
          console.log(this.name);
        }
      }

      let user7 = new Use("Aakash");

      user7.show();
    </script>
  </body>
</html>
