<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OOPS</title>
</head>
<body>
    <script>
        // oops:- object oriented programming
        // oop ek programming approach h jisme hum code ko objects k around organize krte h.

        // example :- car => properties :- color,brand,speed & Method:- start,stop,accelerate

        const car = {
            brand : "bmw",
            color : "black",
            speed: 200,

            start(){
                console.log("car started");
            },

            stop(){
                console.log("car stopped");
            }
        };

        console.log(car.brand);
        console.log(car.color);

        car.start();
        car.stop();

        // classes :- js m class ek blueprint/template hoti h jiske basis pr hum multiple object bana sakte h.

        class Student {
            name = "Aakash";
            age = 23;
        }

        const student1 = new Student();
        console.log(student1.name);
        console.log(student1.age);
        

        // constructor:- constructor ek special method hota h jo object create hote hi automatically execute hota h.
        // main use of constructor:- constructor k trough hum object ki initial properties set kr sakte h 

        class A{
            constructor(n,a){
                this.n = n;
                this.a = a;
                
            }
        }

        const a1 = new A("Rahul",25);
        const a2 = new A("Aman",24);

        console.log(a1.n);
        console.log(a1.a);

        console.log(a2.n);
        console.log(a2.a);
    </script>
</body>
</html>
