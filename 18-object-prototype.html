<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>object-prototype</title>
  </head>
  <body>
    <script>
      // Object-Prototype :- Prototype JavaScript ka ek object hota hai jisse koi object properties aur methods inherit kar sakta hai.

      //Q1
      let user = {
        name: "Aakash",
      };

      console.log(user.toString());

      // Q2 use getPrototypeOf()

      let u1 = {
        n: "rahul",
      };
      console.log(Object.getPrototypeOf(u1));

      //Q3 compare Equal operater

      let u2 = {
        name: "Aakash",
      };

      console.log(Object.getPrototypeOf(u2) === Object.prototype); //true

      //Q4 hasowenproperty()

      let u3 = {
        name: "Aakash",
      };

      console.log(u3.hasOwnProperty("name"));

      //Q4 Object.create()

      let person = {
        greet: function () {
          console.log("hello");
        },
      };
      let u4 = Object.create(person);
      u4.name = "pawan";
      u4.greet();

      // Q5 custom prototype

      let userMethods = {
        greet() {
          console.log("Hello " + this.name);
        },
      };

      let user1 = Object.create(userMethods);
      let user2 = Object.create(userMethods);

      user1.name = "Aakash";
      user2.name = "Rahul";

      user1.greet();
      user2.greet();

      //Q6 constructor + .prototype

      // constructor function

      function u8(name, age) {
        this.name = name;
        this.age = age;
      }
      let u5 = new u8("Aakash", 23);
      let u7 = new u8("Shivam", 25);

      console.log(u5.name);
      console.log(u7.name);

      // . prototype

      function u9(name, age) {
        this.name = name;
        this.age = age;
      }
      u9.prototype.greet = function () {
        console.log("Hello " + this.name);
      };

      let u11 = new u9("rahul", 25);
      let u22 = new u9("kunal", 23);

      u11.greet();
      u22.greet();

      // Intanceof()

      //Q

      function u13(name) {
        this.name = name;
      }
      let use1 = new u13("Pankaj");
      console.log(use1 instanceof u13); // true

      //Q user , array , object

      function User(name) {
        this.name = name;
      }

      let usr = new User("Aakash");

      console.log(usr instanceof User); // true
      console.log(usr instanceof Object); //true
      console.log(usr instanceof Array); //false

      //Q getPrototypeof()

      function User1(name) {
        this.name = name;
      }

      let uer = new User1("Aakash");

      console.log(Object.getPrototypeOf(uer) === User1.prototype);
    </script>
  </body>
</html>
