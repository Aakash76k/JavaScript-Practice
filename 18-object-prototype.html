<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>object-prototype</title>
  </head>
  <body>
    <script>
      // Object-Prototype :- Prototype JavaScript ka ek object hota hai jisse koi object properties aur methods inherit kar sakta hai.

      //Q1
      let user = {
        name: "Aakash",
      };

      console.log(user.toString());

      // Q2 use getPrototypeOf()

      let u1 = {
        n: "rahul",
      };
      console.log(Object.getPrototypeOf(u1)); 

      //Q3 compare Equal operater

      let u2 = {
        name: "Aakash",
      };

      console.log(Object.getPrototypeOf(u2) === Object.prototype); //true
    </script>
  </body>
</html>
