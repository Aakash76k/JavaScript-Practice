<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Event</title>
</head>
<body>
    <!-- onclick -->
     <button onclick="sayhello()">Clickme</button>
     <h1 id="title">one</h1>

     <!-- addEventlistener -->
      <button id="btn">Clickme2</button>

      <!-- click event -->
       <h1 id="t1">3rd event</h1>
       <button id="btn1">change text</button>

       <!-- mouse Event  -->
        <!-- 1st mouseover -->

        <div id="box">Hover Me</div>
    <script>
        // 1 on click:-  HTML ke andar event

        function sayhello(){
            //console.log("hello 1st event");
            document.getElementById("title").innerText = "1st event";
        }

        //2 Add Event Listener:-JavaScript se event listener
        //  ka fayda ye hai ki ek hi element par multiple listeners laga sakte ho
        
        let btn = document.getElementById("btn");
        btn.addEventListener("click",function(){
            console.log("2nd button clicked");
        });

        // 3 click event :- Jab user element par click kare.

        let btn1 = document.getElementById("btn1");
        let t1 = document.getElementById("t1");

        btn1.addEventListener("click", function(){
            t1.innerText = "3rd button";
        });

        // 4 Mouse Event :- 
        // a) mouseover:- tab fire hota hai jab mouse element ke upar aata hai.

        let box = document.getElementById("box");
        // box.addEventListener("mouseover", function(){
        //     box.style.backgroundColor = "blue";
        //     box.style.color = "white"
        //     console.log("mouse is over the box");
        // });

        // b) mouseout:- Jab mouse element se bahar chala jata hai, mouseout fire hota hai.

        box.addEventListener("mouseout",function(){
            console.log("mouse left the box")
        })
        




    </script>
</body>
</html>
