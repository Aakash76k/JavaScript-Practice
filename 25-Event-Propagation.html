<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event-Propagation</title>
</head>
<body>

    <!-- Event Bubbling and Event Capturing -->

    <div id="parent">
        <button id="child">Click-Me</button>
    </div>

    <!-- Event Delegation -->

    <ul id="list">
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
    </ul>

    <script>
        // Event Propagation.

        // 1. Event Bubbling :- Jab ek child element par event hota hai, event parent elements ki taraf upar move karta

        // const parent = document.getElementById("parent");
        // const child = document.getElementById("child");

        // parent.addEventListener("click",function(){
        //     console.log("Parent Clicked");
        // });

        // child.addEventListener("click", function(event){
        //     // event.stopPropagation(); // only child clicked
        //     console.log("Child Clicked")
        //     event.stopPropagation();
        // });

        //2. Event Capturing:- Capturing mein event upar se neeche aata hai:

        const parent = document.getElementById("parent");
        const child = document.getElementById("child");

        parent.addEventListener("click", function(){
            console.log("Parent Clicked")
        },true);

        child.addEventListener("click", function(){
            console.log("Child Clicked");
        });

        //3. Event Delegation:- Har child par alag event listener lagane ke bajay parent par ek listener lagana.


        // const items = document.querySelectorAll("li");

        // items.forEach(function(item){
        //     item.addEventListener("click",function(){
        //         console.log(item.innerText);
        //     });
        // });

        const list = document.getElementById("list");

        list.addEventListener("click", function(event){
            console.log(event.target.innerText);
        });


    </script>
</body>
</html>
