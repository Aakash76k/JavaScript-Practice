  <body>
    <!-- AJAX = Asynchronous JavaScript And XML Naam mein XML hai, lekin aajkal AJAX
    mein mostly JSON use hota hai. AJAX ka main purpose kya hai? Server se data
    bina poora webpage reload kiye lena ya bhejna. 
    normal request :- 
    User 
    ↓
    Page request
     ↓

     ↓ 
    New page
     ↓ 
    Page reload

    AJAX :- 

    User

    JavaScript
    ↓
    Server

    Data
    ↓
    JavaScript page update karta hai -->

    <!-- Calling Api -->

    <button id="btn">Load Users</button>

    <div id="users"></div>

    <script>
      // 1.  XMLHttpRequest , AJAX Request , AJAX Response

      //   const btn = document.getElementById("btn");
      //   btn.addEventListener("click", function () {
      //     const xhr = new XMLHttpRequest();
      //     xhr.open("GET", "https://jsonplaceholder.typicode.com/users");
      //     // xhr.onload = function(){

      //     // }

      //     xhr.onload = function () {
      //       //   const data = JSON.parse(xhr.responseText); //JSON.parse() ne JSON string ko JavaScript object/array mein convert kiya hai.
      //       const data = JSON.stringify(xhr.responseText); // JSON.stringify() exactly JSON.parse() ka opposite hai.
      //       console.log(data);
      //     };
      //     xhr.send();
      //   });

      // calling Api

      const btn = document.getElementById("btn");
      const users = document.getElementById("users");

      btn.addEventListener("click", function () {
        const xhr = new XMLHttpRequest();

        xhr.open("GET", "https://jsonplaceholder.typicode.com/users");

        xhr.onload = function () {
          const data = JSON.parse(xhr.responseText);

          data.forEach(function (user) {
            const p = document.createElement("p");

            p.innerText = user.name;

            users.append(p);
          });
        };

        xhr.send();
      });
    </script>
  </body>
