<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event-Loop</title>
  </head>
  <body>
    <script>
      //Event loop :- JavaScript single-threaded hai — matlab ek time par JavaScript ka main code ek hi kaam execute karta hai.

      // Lekin phir question:

      // setTimeout(), API calls, promises jaise asynchronous kaam kaise handle hote hain?  Yahin Event Loop ka role aata hai

      //1. call Stack:- JavaScript mein jo functions execute hote hain, woh Call Stack mein aate hain.

      function one() {
        console.log("one");
      }

      function two() {
        console.log("two");
      }

      one();
      two();

      //Q2

      console.log("start");

      function test() {
        console.log("Inside");
      }

      test();

      console.log("End");

      //2. Web Api :- Browser JavaScript ko kuch extra features deta hai, jinhe hum Web APIs kehte hain.

      console.log("start");
      setTimeout(function () {
        console.log("Timer");
      }, 2000);

      console.log("End");

      //3. Callback Queue :- Jab asynchronous kaam complete ho jata hai, uska callback Callback Queue mein wait karta hai.

      console.log("1");

      setTimeout(() => {
        console.log("2");
      }, 0);

      console.log("3");

      setTimeout(() => {
        console.log("4");
      }, 0);

      console.log("5");

    </script>
  </body>
</html>
