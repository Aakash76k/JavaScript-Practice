<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced-Javascript</title>
  </head>
  <body>
    <script>
      // strict mode:- Strict mode JavaScript ko more strict/safer rules ke saath run karata hai.

      //   "use strict";
      //   x = 10;
      //   console.log(x); // ReferenceError: x is not defined

      // Q1

      ("use strict");

      function test() {
        let y = 20;
        console.log(y);
      }

      test();

      //2. Clousre Revision :- Inner function apne outer function ke variables ko yaad rakhta hai, even outer function execute hone ke baad bhi.
      // Closure = Function + uska outer lexical environment

      function outer() {
        let count = 0;

        function inner() {
          count++;
          console.log(count);
        }

        return inner;
      }

      const counter = outer();

      counter();
      counter();
      counter();

      //3. currying:- Ek function ke multiple parameters ko ek-ek karke functions ke through lena.

      // normal function:-
      function add(a, b, c) {
        return a + b + c;
      }

      console.log(add(10, 20, 30));

      // currying function:-

      function add(a) {
        return function (b) {
          return function (c) {
            return a + b + c;
          };
        };
      }

      console.log(add(10)(20)(30));

      //4. Higher-Order Functions:-  Jo function kisi doosre function ko argument ke roop mein leta hai ya function return karta hai, usse Higher-Order Function kehte hain.
      // map(),filter(), reduce(), forEach(), find()
      function greet(name) {
        console.log("Hello " + name);
      }

      function processUser(callback) {
        callback("Aakash");
      }

      processUser(greet);

      //q2 return function

      function multiplyBy(num) {
        return function (value) {
          return value * num;
        };
      }

      const double = multiplyBy(2);

      console.log(double(5));

      //5. Functional Programming:- Functions ko primary building blocks ki tarah use karke code likhna = Functional Programming.
      // map(),filter(), reduce(), forEach(), find()

      const numbers = [1, 2, 3];

      const newNumbers = [...numbers, 4];

      console.log(numbers);
      console.log(newNumbers);

      // 1. map

      const number = [1, 2, 3, 4];

      const result = number.map((num) => num * 2);

      console.log(result);

      // 2. filter

      const num = [1, 2, 3, 4, 5, 6];

      const res = num.filter((num) => num % 2 === 0);

      console.log(res);

      //3. reduce

      const nums = [1, 2, 3, 4];

      const result1 = nums.reduce((total, num) => {
        return total + num;
      }, 0);

      console.log(result1);

      //Synchronous vs asynchronous programming

      console.log("1");

      setTimeout(function () {
        console.log("2");
      }, 2000);

      console.log("3");

      // normal callback

      // function greet(name, callback) {
      //   console.log("Hello " + name);
      //   callback();
      // }

      // function bye() {
      //   console.log("Bye!");
      // }

      // greet("Aakash", bye); // Yahan bye function ko greet() ke andar argument ke roop me pass kiya gaya hai.Isliye bye ek callback function hai.

      // Advance callback :- Callback ko dynamically control karna, multiple callbacks handle karna, callbacks ke through asynchronous operations manage karna, aur callback execution ka flow samajhna.
      //
      function calculate(a, b, operation) {
        return operation(a, b);
      }

      const add1 = (a, b) => a + b;
      const reslt = calculate(10, 5, add1);
      console.log(reslt);

      //1. Asynchronous callback:-
      //Yahin se callbacks ka connection aata hai:

      // Callback Queue
      // Microtask Queue
      // Event Loop
      // setTimeout()
      // Promises
      // Async execution order

      console.log("Start");

      setTimeout(() => {
        console.log("Inside callback");
      }, 2000);

      console.log("End");

      //2. callback hell:- Multiple asynchronous callbacks nested ho jaayein:

      function getUser(callback) {
        setTimeout(() => {
          console.log("User mil gaya");
          callback("Aakash");
        }, 1000);
      }

      function getPosts(user, callback) {
        setTimeout(() => {
          console.log(user + " ke posts mil gaye");
          callback(["Post 1", "Post 2"]);
        }, 1000);
      }

      function getComments(posts, callback) {
        setTimeout(() => {
          console.log("Comments mil gaye");
          callback(["Comment 1", "Comment 2"]);
        }, 1000);
      }

      function getLikes(comments, callback) {
        setTimeout(() => {
          console.log("Likes mil gaye");
          callback(100);
        }, 1000);
      }

      getUser(function (user) {
        getPosts(user, function (posts) {
          getComments(posts, function (comments) {
            getLikes(comments, function (likes) {
              console.log("Total Likes:", likes);
            });
          });
        });
      });

      // Memory and Garbage Collection

      // memory:- Jab JavaScript program run hota hai, variables, objects, functions etc. ko memory me space milti hai.

      let name = "Aakash";
      let age = 24;

      const user = {
        name: "Aakash",
        age: 24,
      };

      // Garbage collection:- JavaScript automatically unused memory ko clean karta hai.Is process ko Garbage Collection (GC) kehte hain.

      let user1 = {
        name: "Aakash",
      };

      user1 = null;
    </script>
  </body>
</html>
