<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced-Javascript</title>
  </head>
  <body>
    <script>
      // strict mode:- Strict mode JavaScript ko more strict/safer rules ke saath run karata hai.

      //   "use strict";
      //   x = 10;
      //   console.log(x); // ReferenceError: x is not defined

      // Q1

      ("use strict");

      function test() {
        let y = 20;
        console.log(y);
      }

      test();

      //2. Clousre Revision :- Inner function apne outer function ke variables ko yaad rakhta hai, even outer function execute hone ke baad bhi.
      // Closure = Function + uska outer lexical environment

      function outer() {
        let count = 0;

        function inner() {
          count++;
          console.log(count);
        }

        return inner;
      }

      const counter = outer();

      counter();
      counter();
      counter();

      //3. currying:- Ek function ke multiple parameters ko ek-ek karke functions ke through lena.

      // normal function:-
      function add(a, b, c) {
        return a + b + c;
      }

      console.log(add(10, 20, 30));

      // currying function:-

      function add(a) {
        return function (b) {
          return function (c) {
            return a + b + c;
          };
        };
      }

      console.log(add(10)(20)(30));

      //4. Higher-Order Functions:-  Jo function kisi doosre function ko argument ke roop mein leta hai ya function return karta hai, usse Higher-Order Function kehte hain.

      function greet(name) {
        console.log("Hello " + name);
      }

      function processUser(callback) {
        callback("Aakash");
      }

      processUser(greet);

      //q2 return function

      function multiplyBy(num) {
        return function (value) {
          return value * num;
        };
      }

      const double = multiplyBy(2);

      console.log(double(5));
    </script>
  </body>
</html>
