<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather-App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="weather-app">
      <h1>🌤️ Weather App</h1>
      <div class="search-box">
        <input type="text" id="cityInput" placeholder="Enter your city name" />
        <button id="searchBtn">Search</button>
      </div>
      <p id="errorMessage"></p>
      <div class="weather-card">
        <h2 id="cityName">New Delhi</h2>
        <div class="weather-icon" id="weatherIcon">☀️</div>
        <h3 id="temperature">28°C</h3>
        <p id="condition">Clear Sky</p>
        <div class="weather-info">
          <div class="info-box">
            <span>💧</span>
            <p>Humidity</p>
            <strong id="humidity">60%</strong>
          </div>
          <div class="info-box">
            <span>💨</span>
            <p>Wind Speed</p>
            <strong id="windSpeed">12 km/h</strong>
          </div>

          <div class="info-box">
            <span>🌡️</span>
            <p>Feels Like</p>
            <strong>30°C</strong>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
